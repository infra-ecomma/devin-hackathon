<!doctype html>
<html lang="en" data-mode="plate">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tellurion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230F172A'/%3E%3Cpath%20transform='translate(9.72,6)%20scale(0.2326)'%20fill='%2357CAFB'%20fill-rule='evenodd'%20d='M0,0C17.49,0,34.98,0,53,0C53,4.95,53,9.9,53,15C41.12,15,29.24,15,17,15C17,21.93,17,28.86,17,36C27.56,36,38.12,36,49,36C49,40.95,49,45.9,49,51C38.44,51,27.88,51,17,51C17,57.6,17,64.2,17,71C29.21,71,41.42,71,54,71C54,75.95,54,80.9,54,86C36.18,86,18.36,86,0,86C0,57.62,0,29.24,0,0Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Live Artifact — instrument chrome.
   Two registers, one geometry:
   plate        ink on paper, an engraved chart (default, per the standing preference)
   observatory  the same instrument lit from behind
   Canvas and SVG read these tokens via getComputedStyle, so the whole drawing
   retunes when data-mode flips. Lime speaks ONLY for what is happening right now. */

:root {
  --paper:      #F5F7FB;
  --card:       #FFFFFF;
  --ink:        #001033;
  --ink-70:     rgba(0, 16, 51, .70);
  --ink-45:     rgba(0, 16, 51, .60);
  --ink-28:     rgba(0, 16, 51, .42);
  --line:       rgba(0, 16, 51, .13);
  --line-faint: rgba(0, 16, 51, .065);
  --blue:       #0077FF;
  --blue-deep:  #0055CC;
  --blue-soft:  rgba(0, 119, 255, .09);
  --blue-mid:   rgba(0, 119, 255, .38);
  --live:       #9DFF00;
  --live-ink:   #4F8A00;
  --fault:      #C0303A;
  --ghost:      rgba(0, 16, 51, .20);
  --pink:       #E0348B;
  --pink-soft:  rgba(224, 52, 139, .12);
  --purple:     #7C4DEF;
  --purple-soft: rgba(124, 77, 239, .55);
  --amber:      #D89000;
  --card-shadow: 0 8px 28px rgba(0, 16, 51, .09), 0 1px 3px rgba(0, 16, 51, .07);
  --hairline: .75px;
}

html[data-mode="observatory"] {
  --paper:      #030A1C;
  --card:       #081833;
  --ink:        #D9E6FF;
  --ink-70:     rgba(217, 230, 255, .74);
  --ink-45:     rgba(217, 230, 255, .58);
  --ink-28:     rgba(217, 230, 255, .38);
  --line:       rgba(159, 191, 235, .17);
  --line-faint: rgba(159, 191, 235, .08);
  --blue:       #3D9BFF;
  --blue-deep:  #7DBCFF;
  --blue-soft:  rgba(61, 155, 255, .12);
  --blue-mid:   rgba(61, 155, 255, .45);
  --live-ink:   #B9FF4D;
  --fault:      #FF7B7B;
  --ghost:      rgba(217, 230, 255, .22);
  --pink:       #FF5CA8;
  --pink-soft:  rgba(255, 92, 168, .16);
  --purple:     #A78BFF;
  --purple-soft: rgba(167, 139, 255, .55);
  --amber:      #FFC24D;
  --card-shadow: 0 10px 34px rgba(0, 0, 0, .5), 0 0 0 1px rgba(159, 191, 235, .07);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: Inter, system-ui, sans-serif;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background .45s ease, color .45s ease;
}
html[data-mode="observatory"] body {
  background:
    radial-gradient(1200px 800px at 38% 46%, #071430 0%, #030A1C 62%, #02050F 100%);
}

.eyebrow {
  font-family: Orbitron, sans-serif;
  font-size: 16px; font-weight: 700;
  letter-spacing: .34em; text-transform: uppercase;
  color: var(--ink);
  white-space: nowrap;
}
.subline {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px; color: var(--ink-45);
  letter-spacing: .04em; margin-top: 3px;
  white-space: nowrap;
}

/* ------------------------------------------------------------- header */

.bar {
  height: 68px; flex: 0 0 68px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; padding: 0 22px;
  border-bottom: var(--hairline) solid var(--line);
  background: color-mix(in srgb, var(--card) 55%, transparent);
  backdrop-filter: blur(6px);
  position: relative; z-index: 30;
}
.bar-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.mark { height: 30px; width: auto; flex: 0 0 auto; }
html[data-mode="observatory"] .mark path { fill: #57CAFB; }

.census { display: flex; align-items: center; gap: 26px; position: relative; min-width: 0; }
/* At 1280 the project subline ran straight under the census and both became
   unreadable. The title block yields; the census never does, and below 1180 the
   fleet-bench group folds away because it is the part that is not about him. */
.bar-left { min-width: 0; }
.titleblock { min-width: 0; }
.titleblock .subline { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
@media (max-width: 1180px) {
  .census { gap: 16px; }
  .cn-bench, .cn-rule, .cn-bench-lab { display: none; }
  .titleblock .subline { max-width: 22ch; }
}
@media (max-width: 980px) {
  .titleblock .subline { display: none; }
}
.cn-rule { width: 1px; align-self: stretch; margin: 2px 0; background: var(--line); }
.cn-bench b { color: var(--ink-45); font-weight: 500; }
.cn-bench span { color: var(--ink-28); }
.cn-bench-lab { position: absolute; right: 0; bottom: -9px; font: 400 7.5px/1 "JetBrains Mono", monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-28); pointer-events: none; }
.cn { display: flex; flex-direction: column; align-items: center; gap: 1px; }
.cn b {
  font-family: Orbitron, sans-serif; font-weight: 600; font-size: 19px;
  color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1;
}
.cn span {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-45);
}
.cn-ms b { color: var(--blue); }

.bar-right { display: flex; align-items: center; gap: 18px; }
.gauge { text-align: right; }
.gauge-num {
  font-family: Orbitron, sans-serif; font-size: 21px; font-weight: 700;
  color: var(--blue); line-height: 1; font-variant-numeric: tabular-nums;
}
.gauge-lab {
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-45); margin-top: 2px;
}
.mode {
  font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-70);
  background: none; border: var(--hairline) solid var(--line);
  border-radius: 8px; padding: 7px 13px; cursor: pointer;
  transition: color .2s, border-color .2s, background .2s;
}
.mode:hover { color: var(--blue); border-color: var(--blue-mid); background: var(--blue-soft); }
.live { display: flex; align-items: center; gap: 7px; }
.live i {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--live); box-shadow: 0 0 0 0 rgba(157, 255, 0, .5);
  animation: livepulse 2.2s infinite;
}
.live.down i { background: var(--fault); animation: none; }
.live.demo i { background: var(--blue); animation: none; }
@keyframes livepulse {
  0% { box-shadow: 0 0 0 0 rgba(157, 255, 0, .45); }
  70% { box-shadow: 0 0 0 7px rgba(157, 255, 0, 0); }
  100% { box-shadow: 0 0 0 0 rgba(157, 255, 0, 0); }
}
.live span {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase; color: var(--ink-45);
}

/* ------------------------------------------------------------- stage */

.stage { flex: 1; display: flex; min-height: 0; position: relative; }

.plate { flex: 1; position: relative; min-width: 0; }
#plate { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: default; }

.plate-title { position: absolute; top: 20px; left: 26px; pointer-events: none; }
.pt-t {
  font-family: Orbitron, sans-serif; font-size: 17px; font-weight: 700;
  letter-spacing: .3em; text-transform: uppercase; color: var(--ink);
}
.pt-s {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.75;
  color: var(--ink-45); margin-top: 6px; letter-spacing: .03em;
}

/* scrub readout */
.scrub-readout {
  position: absolute; top: 20px; right: 26px;
  display: flex; align-items: baseline; gap: 10px;
  background: var(--card); border: var(--hairline) solid var(--line);
  border-radius: 8px; padding: 8px 12px; box-shadow: var(--card-shadow);
}
.sr-lab {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-45);
}
.scrub-readout b {
  font-family: Orbitron, sans-serif; font-size: 15px; font-weight: 600; color: var(--blue);
}
.scrub-readout button {
  font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--blue);
  background: var(--blue-soft); border: none; border-radius: 6px;
  padding: 4px 9px; cursor: pointer;
}

/* ------------------------------------------------------------- key */

/* Small button at rest, the whole legend when opened. He asked for exactly that:
   one control that expands into what every mark means, the motion table
   included. So the closed state stays a chip and the open state is a panel. */
.key {
  position: absolute; left: 26px; bottom: 22px; width: 430px;
  background: var(--card); border: var(--hairline) solid var(--line);
  border-radius: 12px; box-shadow: var(--card-shadow);
  overflow: hidden; z-index: 10;
  transition: width .18s ease;
}
.key.closed { width: 108px; }
.key-body { max-height: min(72vh, 720px); overflow-y: auto; overscroll-behavior: contain; }
.key-sec {
  font-family: Orbitron, sans-serif; font-size: 9px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; color: var(--ink-45);
  padding: 13px 0 5px; margin-top: 4px; border-top: var(--hairline) solid var(--line);
}
.key-body > .key-sec:first-child { border-top: none; margin-top: 0; padding-top: 4px; }
.key-row .kr-name b { font-weight: 700; color: var(--ink); }
.key-row.k-live svg { color: var(--live-ink, var(--blue)); }
.key-row.k-bench svg, .key-row.k-bench .kr-name { color: var(--ink-45); }
.key-motion { width: 100%; border-collapse: collapse; margin: 6px 0 2px; font-family: 'JetBrains Mono', monospace; }
.key-motion th {
  font-size: 8px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-45);
  text-align: left; font-weight: 500; padding: 4px 8px 4px 0; border-bottom: var(--hairline) solid var(--line);
}
.key-motion td {
  font-size: 9px; line-height: 1.55; color: var(--ink-70); vertical-align: top;
  padding: 5px 8px 5px 0; border-bottom: var(--hairline) solid var(--line);
}
.key-motion td:first-child { color: var(--ink); white-space: nowrap; }
/* Named as not built rather than quietly listed: a legend describing a version
   that does not exist is the same defect as a screen reporting work nobody did. */
.key-motion tr.k-todo td { color: var(--ink-28); }
.key-motion tr.k-todo td:last-child { font-style: italic; }
.key-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 8px;
}
.key-head span {
  font-family: Orbitron, sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: .3em; text-transform: uppercase; color: var(--ink-70);
}
.key-head button {
  background: none; border: none; color: var(--ink-45); cursor: pointer;
  font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1; padding: 2px 4px;
}
.key.closed .key-body { display: none; }
.key-body { padding: 2px 16px 14px; }
.key-row { display: flex; align-items: center; gap: 10px; padding: 4.5px 0; }
.key-row svg { flex: 0 0 26px; height: 18px; overflow: visible; }
.key-row .kr-name {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink);
  letter-spacing: .02em; flex: 1;
}
.key-row .kr-n {
  font-family: Orbitron, sans-serif; font-size: 11px; font-weight: 600;
  color: var(--ink-45); font-variant-numeric: tabular-nums;
}
.key-sep { height: var(--hairline); background: var(--line); margin: 6px 0; }
.key-note {
  font-family: 'JetBrains Mono', monospace; font-size: 8.8px; line-height: 1.7;
  color: var(--ink-45); padding-top: 6px;
}
.key-note em { color: var(--live-ink); font-style: normal; }

/* ------------------------------------------------------------- dossier */

.dossier {
  position: absolute; right: 26px; bottom: 22px; width: 315px; max-height: 55%;
  background: var(--card); border: var(--hairline) solid var(--line);
  border-radius: 12px; box-shadow: var(--card-shadow);
  padding: 16px 18px 14px; overflow: auto; z-index: 12;
}
.do-kind {
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--blue); margin-bottom: 5px;
}
.do-name {
  font-family: Orbitron, sans-serif; font-size: 16px; font-weight: 700;
  color: var(--ink); letter-spacing: .04em; margin-bottom: 2px;
}
.do-status {
  display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
  letter-spacing: .14em; text-transform: uppercase;
  border: var(--hairline) solid var(--line); border-radius: 6px;
  padding: 2.5px 7px; color: var(--ink-70); margin: 4px 0 8px;
}
.do-status.live { color: var(--blue); border-color: var(--blue-mid); background: var(--blue-soft); }
.do-status.dormant { color: var(--ink-45); border-style: dashed; }
.do-act {
  margin-top: 12px; font: 500 10.5px/1 Inter, sans-serif; letter-spacing: .05em; text-transform: uppercase;
  color: var(--blue); background: transparent; border: 1px solid var(--blue-mid); border-radius: 8px;
  padding: 8px 12px; cursor: pointer;
}
.do-act:hover { background: var(--blue-soft); }
.do-act.undo { color: var(--ink-45); border-color: var(--line); }
.do-act[disabled] { opacity: .5; cursor: default; }
.do-act-say { font: 400 10px/1 "JetBrains Mono", monospace; color: var(--ink-45); margin-left: 9px; }
.do-act-note { margin-top: 11px; font: 400 10.5px/1.6 Inter, sans-serif; color: var(--ink-45); }
/* The chain of custody wears one palette everywhere it appears, so a card and a
   moon and a spine row cannot say different things about the same step. */
.do-status.open { color: var(--ink-45); border-style: dashed; }
.do-status.building { color: var(--ink-45); border-style: dashed; }
.do-status.in-hand { color: var(--ink); border-color: var(--live); background: color-mix(in srgb, var(--live) 22%, transparent); }
.do-status.claimed { color: var(--pink); border-color: var(--pink); }
.do-status.verified { color: var(--blue); border-color: var(--blue-mid); background: var(--blue-soft); }
.do-status\.fully-verified,
.do-status.fully-verified { color: var(--blue-deep, var(--blue)); border-color: var(--blue); background: var(--blue-soft); box-shadow: 0 0 0 2px var(--blue-soft); }

/* Day zero. A project with nothing declared showed an empty rail and a stray
   10px cord stub, which reads as a rendering fault rather than as an invitation.
   It says what to do, and where, in the words a person would use. */
.splan-bad, .splan-warn {
  margin: 14px 20px 4px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--pink); background: color-mix(in srgb, var(--pink) 9%, transparent);
  font: 400 11.5px/1.6 Inter, sans-serif; color: var(--ink-70);
  display: grid; gap: 5px;
}
.splan-warn { border-color: var(--amber, #D89000); background: color-mix(in srgb, #D89000 10%, transparent); }
.splan-bad b, .splan-warn b { font: 600 12px/1.4 Inter, sans-serif; color: var(--ink); }
.sempty { padding: 26px 22px 30px; max-width: 46ch; }
.sempty h4 { font: 600 13px/1.3 Orbitron, sans-serif; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 10px; color: var(--ink); }
.sempty p { font: 400 12.5px/1.65 Inter, sans-serif; color: var(--ink-70); margin: 0 0 12px; }
.sempty code { font: 500 11.5px/1.5 "JetBrains Mono", monospace; color: var(--ink); background: var(--blue-soft); padding: 1px 5px; border-radius: 4px; }
.sempty pre { font: 400 11px/1.55 "JetBrains Mono", monospace; color: var(--ink-70); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; overflow-x: auto; margin: 0 0 12px; }
.sempty button { font: 500 11px/1 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); background: transparent; border: 1px solid var(--blue-mid); border-radius: 8px; padding: 8px 13px; cursor: pointer; }
.sempty button:hover { background: var(--blue-soft); }
.sempty button:disabled { opacity: .5; cursor: default; }
.sempty .sempty-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
.sempty .sempty-actions .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
.sempty .sempty-actions .primary:hover { filter: brightness(1.08); }
.sempty .ok { display: block; color: var(--blue); font: 500 11px/1.5 Inter, sans-serif; margin: 6px 0 10px; }

/* The plan editor (T3) and the edit bar that opens it */
.splan-edit { display: flex; align-items: center; gap: 10px; padding: 8px 2px 10px; }
.splan-edit button { font: 500 10.5px/1 Inter, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); background: transparent; border: 1px solid var(--blue-mid); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
.splan-edit button:hover { background: var(--blue-soft); }
.splan-edit-note { font: 500 10.5px/1.5 "JetBrains Mono", monospace; color: var(--ink-70); }
.splan-edit-note.bad { color: var(--red, #C0392B); }
.pedit-overlay { position: fixed; inset: 0; background: rgba(0, 10, 30, .48); z-index: 60; display: flex; align-items: flex-start; justify-content: center; padding: 4vh 16px; }
.pedit { background: var(--bg, #fff); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; width: min(760px, 96vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 18px 60px rgba(0, 16, 51, .35); }
.pedit-h { display: flex; align-items: baseline; gap: 12px; padding: 14px 18px 10px; border-bottom: 1px solid var(--line); }
.pedit-h b { font: 600 13px/1.3 Orbitron, sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.pedit-h span { font: 400 11.5px/1.4 Inter, sans-serif; color: var(--ink-70); }
.pedit-body { overflow-y: auto; padding: 12px 18px; }
.pedit-body h5 { font: 600 11px/1 Orbitron, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-70); margin: 14px 0 8px; }
.pedit input { font: 400 12px/1.4 Inter, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
.pedit select { font: 400 11.5px/1.4 Inter, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 6px; }
.pedit-prow { display: grid; grid-template-columns: 1.1fr 1fr 1.2fr 26px; gap: 6px; margin-bottom: 6px; }
.pedit-srow { display: grid; grid-template-columns: 1.6fr 92px 1fr 26px; gap: 6px; margin-bottom: 6px; }
.pedit-phase { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; }
.pedit-phase-h { display: grid; grid-template-columns: 1fr 26px; gap: 6px; margin-bottom: 8px; }
.pedit button { font: 500 10.5px/1 Inter, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--blue); background: transparent; border: 1px solid var(--blue-mid); border-radius: 7px; padding: 6px 10px; cursor: pointer; }
.pedit button:hover { background: var(--blue-soft); }
.pedit button:disabled { opacity: .5; cursor: default; }
.pedit .p-del, .pedit .s-del, .pedit .ph-del { color: var(--red, #C0392B); border-color: var(--line); padding: 6px 0; }
.pedit-add { margin: 4px 0 2px; }
.pedit-add button { border-style: dashed; color: var(--ink-70); }
.pedit-conn { padding: 0 18px; max-height: 22vh; overflow-y: auto; }
.pedit-conn-h { font: 600 11px/1.5 Inter, sans-serif; color: var(--ink); margin: 8px 0 4px; }
.pedit-conn-row { font: 400 11.5px/1.5 Inter, sans-serif; color: var(--ink-70); margin: 2px 0; }
.pedit-conn-row b { color: var(--ink); }
.pedit-conn-row code { font: 500 11px/1.4 "JetBrains Mono", monospace; color: var(--ink); background: var(--blue-soft); padding: 0 4px; border-radius: 4px; }
.pedit-conn-row.miss b { color: var(--amber, #D89000); }
.pedit-conn-row.prop button { margin-left: 8px; }
.pedit-conn > button { margin: 8px 0; }
.pedit-f { display: flex; align-items: center; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
.pedit-f .primary { color: #fff; background: var(--blue); border-color: var(--blue); }
.pedit-f .ok { font: 500 11px/1.5 Inter, sans-serif; color: var(--blue); margin-left: auto; text-align: right; max-width: 46%; }

.do-line { font-size: 12px; line-height: 1.55; color: var(--ink-70); margin-bottom: 10px; }
.do-sec {
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-45);
  margin: 10px 0 5px; padding-top: 8px; border-top: var(--hairline) solid var(--line);
}
.do-item { display: flex; gap: 8px; align-items: baseline; padding: 2.5px 0; }
.do-item .di-date {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-45);
  flex: 0 0 44px; font-variant-numeric: tabular-nums;
}
.do-item .di-txt { font-size: 11px; line-height: 1.45; color: var(--ink); }
.do-item.ghost .di-txt { color: var(--ink-45); }
.do-item .di-dot { flex: 0 0 5px; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); position: relative; top: -1px; }
.do-item .di-dot.pink { background: var(--pink); }
.do-item.ghost .di-dot { background: none; border: 1px solid var(--ink-28); }
.do-home {
  font-family: 'JetBrains Mono', monospace; font-size: 8.8px; color: var(--ink-45);
  margin-top: 10px; word-break: break-all;
}

/* ------------------------------------------------------------- tip */

.tip {
  position: absolute; pointer-events: none; z-index: 20;
  background: var(--card); border: var(--hairline) solid var(--line);
  border-radius: 8px; box-shadow: var(--card-shadow);
  padding: 6px 10px; max-width: 260px;
}
.tip .t-name { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; color: var(--ink); }
.tip .t-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-45); margin-top: 2px; }

/* ------------------------------------------------------------- spine */

.spinewrap {
  flex: 0 0 496px; min-width: 0;
  border-left: var(--hairline) solid var(--line);
  display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--card) 34%, transparent);
  position: relative; z-index: 5;
}
.spine-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 20px 22px 12px; gap: 26px;
}
.spine-head .eyebrow { font-size: 14px; }
/* The strip grew a sixth number when the step in hand was split out of "open",
   and with nothing yielding it pushed the score off the right edge of the panel.
   The strip gives way; the score never does, because it is the one figure on
   this panel that has to stay readable. */
.spine-head > div:first-child { min-width: 0; flex: 1 1 auto; }
/* Six numbers now, and at 1920 the last one ended 14px from the score. It wraps
   before it crowds: two comfortable lines beat one line that looks broken. */
.spine-head #featStrip { overflow-wrap: anywhere; max-width: 40ch; }
.spine-score { text-align: right; flex: 0 0 auto; }
.ss-num {
  font-family: Orbitron, sans-serif; font-weight: 700; line-height: 1;
  color: var(--ink); font-variant-numeric: tabular-nums;
}
.ss-num b { font-size: 26px; color: var(--blue); }
.ss-of { font-size: 15px; color: var(--ink-28); padding: 0 1px; }
.ss-num > span:last-child { font-size: 15px; color: var(--ink-45); }
.ss-lab {
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-45); margin-top: 3px;
}
.spine-rule { height: 2px; margin: 0 22px; background: var(--line-faint); border-radius: 1px; overflow: hidden; }
.spine-rule i { display: block; height: 100%; width: 0%; background: var(--blue); transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.spine-body { flex: 1; min-height: 0; padding: 6px 4px 10px 8px; }
#spineSvg { width: 100%; height: 100%; display: block; overflow: visible; }

/* spine svg vocabulary — geometry lives in spine.js, states live here */
.seg-name {
  font-family: Orbitron, sans-serif; font-size: 10.5px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; fill: var(--ink);
}
.seg-count { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: .06em; fill: var(--ink-45); }
.seg-bracket { stroke: var(--line); fill: none; }
.seg.hot .seg-name { fill: var(--blue); }

.rail { stroke: var(--line); fill: none; }
.cord-dark { stroke: var(--line-faint); fill: none; }
.cord-lit { stroke: var(--blue); fill: none; filter: drop-shadow(0 0 2.5px var(--blue-mid)); }

.vb { cursor: default; }
.vb .vb-body { stroke: var(--ink-70); stroke-width: 1; fill: var(--card); }
.vb .vb-wing { stroke: var(--ink-45); stroke-width: .8; fill: none; }
.vb .vb-tick { fill: var(--blue); }
.vb.done .vb-body { fill: var(--card); stroke: var(--ink-70); }
.vb.progress .vb-body { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.3; }
.vb.progress .vb-halo { fill: none; stroke: var(--blue-mid); animation: vbhalo 2.4s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes vbhalo { 0% { opacity: .9; } 60% { opacity: 0; } 100% { opacity: 0; } }
.vb.progress .vb-now { fill: var(--blue); }
.vb.planned .vb-body { fill: url(#vhatch); stroke: var(--ink-28); stroke-dasharray: 3 2.2; }
.vb.planned .vb-wing { stroke: var(--ink-28); }
.vb.future .vb-body { fill: url(#vhatch); stroke: var(--ink-28); stroke-dasharray: 3 2.2; }
.vb.future .vb-wing { stroke: var(--ink-28); }
.vb.hot .vb-body { stroke: var(--blue); stroke-width: 1.5; }

.vb-date { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; fill: var(--ink-45); font-variant-numeric: tabular-nums; }
.vb-label { font-family: Inter, sans-serif; font-size: 10.5px; fill: var(--ink); }
.vb-label.dim { fill: var(--ink-45); }
.vb-leader { stroke: var(--line); fill: none; }

.nerve { stroke: var(--blue); fill: none; opacity: .34; }
.nerve.ghost { stroke: var(--ink-28); }
.nerve-tip { fill: var(--blue); }
.nerve-tip.ghost { fill: none; stroke: var(--ink-28); stroke-width: .8; }
.nerve-tip.verified { fill: var(--blue); stroke: var(--live); stroke-width: 1; }
.seg .nervegroup { opacity: .55; transition: opacity .25s; }
.seg.hot .nervegroup { opacity: 1; }

.sacrum-cap { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: .1em; fill: var(--ink-45); }

/* ------------------------------------------------------------- nerve overlay (cross-panel) */

.nerves { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
.nerves path { stroke: var(--blue); fill: none; opacity: .5; filter: drop-shadow(0 0 3px var(--blue-mid)); }

/* ------------------------------------------------------------- ticker */

.ticker {
  height: 34px; flex: 0 0 34px;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 93%, transparent 100%);
  mask-image: linear-gradient(90deg, #000 0%, #000 93%, transparent 100%);
  border-top: var(--hairline) solid var(--line);
  overflow: hidden; position: relative;
  background: color-mix(in srgb, var(--card) 55%, transparent);
}
.tick-track {
  display: flex; align-items: center; gap: 26px;
  height: 100%; padding: 0 18px;
  font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-45);
  white-space: nowrap;
}
.tk { display: flex; align-items: center; gap: 7px; flex: 0 0 auto; }
.tk i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-28); flex: 0 0 5px; }
.tk.file i, .tk.edit i { background: var(--blue); }
.tk.commit i { background: var(--ink); border-radius: 1px; }
.tk.flow i { background: var(--purple); border-radius: 1px; transform: rotate(45deg); }
.tk.fault i { background: var(--fault); }
.tk.plan i { background: var(--live); }
.tk time { color: var(--ink-28); font-size: 9px; }
.tk.fresh { color: var(--ink); }

::selection { background: var(--blue-soft); }


/* ------------------------------------------------------------- spine v4 (scrollable timeline) */

.spine-body { padding: 0; position: relative; }
#spineList {
  height: 100%; overflow-y: auto; overflow-x: hidden;
  padding: 8px 40px 26px 16px;
  scrollbar-width: thin; scrollbar-color: var(--ink-28) transparent;
  position: relative;
}
#spineList::-webkit-scrollbar { width: 5px; }
#spineList::-webkit-scrollbar-thumb { background: var(--ink-28); border-radius: 3px; }

.srail-wrap { position: relative; }
.srail {
  position: absolute; left: 27px; top: 6px; bottom: 6px; width: 0;
  border-left: var(--hairline) solid var(--line);
}
.scord, .scord-glow {
  position: absolute; left: 25.5px; top: 6px; width: 2.5px; border-radius: 2px;
  background: linear-gradient(180deg, var(--blue) 0%, var(--blue) 82%, var(--blue-deep) 100%);
  transition: height 1.1s cubic-bezier(.25, .8, .25, 1);
}
.scord-glow { filter: blur(4px); opacity: .5; }
.scord::after {
  content: ''; position: absolute; inset: 0; border-radius: 2px;
  background: repeating-linear-gradient(180deg, transparent 0 9px, rgba(255,255,255,.55) 9px 12px);
  animation: cordflow 2.6s linear infinite;
}
@keyframes cordflow { from { background-position: 0 0; } to { background-position: 0 42px; } }

.sseg { position: relative; margin-bottom: 10px; }
.sseg-h {
  position: sticky; top: 0; z-index: 6;
  display: flex; align-items: baseline; gap: 9px;
  padding: 8px 6px 7px 42px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(5px);
  border-bottom: var(--hairline) solid var(--line);
}
.sseg-h .sa {
  position: absolute; left: 34px; top: 9px; bottom: 8px; width: 3px;
  border-radius: 2px; background: var(--blue);
}
.sseg-h.dormant .sa { background: var(--ink-28); }
.sseg-name {
  font-family: Orbitron, sans-serif; font-size: 11.5px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; color: var(--ink);
}
.sseg-score {
  font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-45);
  font-variant-numeric: tabular-nums;
}
.sseg-score b { color: var(--blue); font-weight: 700; }
.sseg-feats {
  margin-left: auto;
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--pink);
}

.srow, .vb { position: relative; }
.srow {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 6.5px 0 6.5px 42px;
  border-radius: 8px;
  animation: srise .5s cubic-bezier(.2, .8, .2, 1) both;
  animation-delay: calc(var(--i, 0) * 26ms);
}
@keyframes srise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.srow:hover { background: var(--blue-soft); }
.srow .snode {
  position: absolute; left: 20px; top: 8px; width: 15px; height: 15px;
}
.srow .snode svg { width: 15px; height: 15px; display: block; overflow: visible; }
.srow .sdate {
  flex: 0 0 42px;
  font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--ink-45);
  padding-top: 2.5px; font-variant-numeric: tabular-nums;
}
.srow .stext {
  font-family: Inter, sans-serif; font-size: 12.5px; line-height: 1.45; color: var(--ink);
  flex: 1; min-width: 0;
}
.srow .stech {
  display: none;
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: var(--ink-28);
  margin-top: 1.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
}
.srow.progress .stext { color: var(--ink); }
.srow.progress .sdate::after { content: ' ·'; color: var(--blue); }
.srow.planned .stext, .srow.future .stext { color: var(--ink-45); }
.srow.future { opacity: .45; }
.srow .gem-done { fill: var(--blue); stroke: none; }
.srow .gem-done-tick { stroke: #fff; stroke-width: 1.6; fill: none; }
.srow .gem-prog { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.4; }
.srow .gem-prog-pulse { fill: none; stroke: var(--blue); animation: gempulse 2.2s infinite; }
@keyframes gempulse { 0% { opacity: .8; r: 5; } 70% { opacity: 0; r: 9; } 100% { opacity: 0; } }
.srow .gem-plan { fill: none; stroke: var(--ink-28); stroke-width: 1.2; stroke-dasharray: 2.5 2; }

.sfeat-strip {
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  padding: 3px 0 8px 52px;
}
.sfeat-strip i {
  width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px;
  background: var(--pink);
}
.sfeat-strip i.open { background: none; border: 1.2px solid var(--pink); }
.sfeat-strip i.verified { box-shadow: 0 0 0 2px var(--pink-soft), 0 0 0 3px var(--blue-mid); }
/* One grammar in both halves: the row wears what the moon wears. */
.stier { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; margin-left: 10px; align-self: center; }
.stier.t-open { background: none; border: 1.2px solid var(--pink); }
.stier.t-in-hand { background: none; border: 1.2px solid var(--pink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 55%, transparent); }
.stier.t-claimed { background: var(--pink); }
.stier.t-verified { background: var(--pink); box-shadow: 0 0 0 2px var(--blue-mid); }
.stier.t-fully-verified { background: var(--pink); box-shadow: 0 0 0 2px var(--blue-mid), 0 0 0 3.6px var(--blue-soft); }
.stier.t-failed { background: var(--fault, #E0348B); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fault, #E0348B) 30%, transparent); }
.do-status.failed { color: var(--fault, #E0348B); border-color: var(--fault, #E0348B); background: color-mix(in srgb, var(--fault, #E0348B) 12%, transparent); }
.sfeat-strip i.accepted { box-shadow: 0 0 0 2px var(--pink-soft), 0 0 0 3px var(--blue-mid), 0 0 0 4.6px var(--blue-soft); }
.sfeat-strip i.in-hand { background: none; border: 1.2px solid var(--pink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 55%, transparent); }
.sfeat-strip span {
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: var(--ink-45);
  margin-left: 4px;
}

/* ---- product > feature > step ---------------------------------------------
   The spine lists a product's FEATURES, and a feature opens to show the steps
   that build it. Three levels in a 330px panel, so each one has to earn its
   line: the feature is the headline and keeps the row indent, the steps sit
   further in, smaller, against one guide line. Both levels are CLOSED by
   default, which is what keeps an opened product legible instead of a wall
   (decision D2, 2026-08-30: "a very crowded spine ruins it"). */
.srow.feat { padding-top: 7px; padding-bottom: 7px; }
.srow.feat .stext { font-weight: 550; letter-spacing: -.005em; }
.srow.feat .sdate { font-size: 9px; color: var(--ink-28); }
/* A feature that has steps says so with one mark, and turns it when open. */
.srow.feat.has-steps { cursor: pointer; }
.srow.feat.has-steps .stext::after {
  content: '\203A'; margin-left: 7px; color: var(--ink-28);
  display: inline-block; transition: transform .18s ease, color .18s ease;
}
.srow.feat.has-steps:hover .stext::after { color: var(--blue); }
.srow.feat.fopen .stext::after { transform: rotate(90deg); color: var(--blue); }

.sstep {
  position: relative;
  display: flex; align-items: flex-start; gap: 8px;
  padding: 3.5px 0 3.5px 64px;
  border-radius: 8px;
  animation: srise .34s cubic-bezier(.2, .8, .2, 1) both;
}
/* One guide line for the whole nested run, drawn per row so it needs no wrapper. */
.sstep::before {
  content: ''; position: absolute; left: 46.5px; top: 0; bottom: 0;
  border-left: var(--hairline) solid var(--line);
}
.sstep.loose::before { border-left-style: dashed; }
.sstep-dot {
  position: absolute; left: 44px; top: 9px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--paper); border: 1.2px solid var(--ink-28);
}
.sstep.done .sstep-dot { background: var(--blue); border-color: var(--blue); }
.sstep.progress .sstep-dot { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-soft); }
.sstep-txt {
  font-family: Inter, sans-serif; font-size: 11.5px; line-height: 1.42;
  color: var(--ink-70); flex: 1; min-width: 0;
}
.sstep.done .sstep-txt { color: var(--ink-45); }
.sstep.progress .sstep-txt { color: var(--ink); }
.sstep:hover { background: var(--blue-soft); }
.stier.small { width: 5.5px; height: 5.5px; margin-left: 8px; }

.sloose-h {
  padding: 8px 0 2px 52px;
  font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
  letter-spacing: .06em; color: var(--ink-28);
}

/* A directory the instrument noticed is NOT a product anybody declared, so it
   stops wearing the same clothes in the same list (decision D4, 2026-08-30). */
.sgroup {
  display: flex; align-items: baseline; gap: 8px;
  margin: 18px 0 6px; padding: 8px 6px 7px 34px;
  cursor: pointer; border-top: var(--hairline) solid var(--line);
}
.sgroup:hover b { color: var(--blue); }
.sgroup-caret { color: var(--ink-28); font-size: 9px; }
.sgroup b {
  font-family: Orbitron, sans-serif; font-size: 9.5px; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase; color: var(--ink-45);
}
.sgroup-n { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: var(--ink-28); }
.sseg.found .sseg-h .sa { background: var(--ink-28); }
.sseg.found .sseg-name { color: var(--ink-45); font-size: 10.5px; }

.sminimap {
  position: absolute; right: 6px; top: 8px; bottom: 10px; width: 16px; z-index: 8;
  cursor: pointer;
}
.sminimap .mt { transition: opacity .2s; }
.sminimap .mview {
  fill: var(--blue-soft); stroke: var(--blue-mid); stroke-width: .8; rx: 3;
}

/* orrery accent glyph colors in the key */
.key-row.k-pink svg { color: var(--pink); }
.key-row.k-purple svg { color: var(--purple); }
.key-row.k-amber svg { color: var(--amber); }


.srow:hover .stech { display: block; }

/* view tabs */
.view-tabs { display: flex; gap: 6px; margin-top: 6px; }
.vt {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-45);
  background: none; border: var(--hairline) solid var(--line);
  border-radius: 7px; padding: 4px 10px; cursor: pointer;
}
.vt.on { color: var(--blue); border-color: var(--blue-mid); background: var(--blue-soft); }

/* key chip behaviour */
.key-head { cursor: pointer; }
.key.closed { width: auto; }
.key.closed .key-head { padding: 8px 13px; }

/* ------------------------------------------------------------- spine map view */
.mseg { position: relative; display: flex; align-items: flex-start; gap: 0; padding: 9px 0; animation: srise .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i,0)*30ms); }
.mtrunk { position: absolute; left: 118px; top: 0; bottom: 0; border-left: 1.6px solid var(--blue-mid); }
.mseg .mleaves {
  flex: 0 0 106px; display: flex; flex-wrap: wrap; gap: 4px 5px;
  justify-content: flex-end; padding: 8px 16px 0 0; position: relative;
}
.mseg .mleaves i { width: 6.5px; height: 6.5px; border-radius: 50%; background: var(--pink); }
.mseg .mleaves i.open { background: none; border: 1.3px solid var(--pink); }
.mseg .mleaves i.verified { box-shadow: 0 0 0 2px var(--blue-mid); }
.mseg .mleaves i.accepted { box-shadow: 0 0 0 2px var(--blue-mid), 0 0 0 3.6px var(--blue-soft); }
.mseg .mleaves i.in-hand { background: none; border: 1.3px solid var(--pink); box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 55%, transparent); }
.mseg .mstem { position: absolute; right: 0; top: 13px; width: 14px; border-top: var(--hairline) solid var(--pink); opacity: .55; }
.mseg .mnode { flex: 0 0 26px; position: relative; z-index: 2; padding-top: 3px; margin-left: -1px; }
.mseg .mnode svg { display: block; overflow: visible; }
.mseg .mbody { flex: 1; min-width: 0; padding-left: 12px; }
.mseg .mname {
  font-family: Orbitron, sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
  display: flex; align-items: baseline; gap: 8px;
}
.mseg .mscore { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-45); font-weight: 400; letter-spacing: .04em; }
.mseg.dormant .mname { color: var(--ink-45); }
.mseg .mbeads { display: flex; flex-wrap: wrap; gap: 3.5px 4.5px; margin-top: 6px; max-width: 240px; }
.mseg .mbeads b {
  width: 8px; height: 8px; transform: rotate(45deg); border-radius: 1.5px; display: block;
  background: var(--blue);
}
.mseg .mbeads b.progress { background: var(--blue-soft); border: 1.3px solid var(--blue); animation: beadpulse 2.2s infinite; }
.mseg .mbeads b.planned { background: none; border: 1.2px dashed var(--ink-28); }
@keyframes beadpulse { 0%,100% { box-shadow: 0 0 0 0 var(--blue-mid); } 50% { box-shadow: 0 0 0 3px transparent; } }
.mseg:hover { background: var(--blue-soft); border-radius: 10px; }
.mseg.hot .mname { color: var(--blue); }

/* logic view */
.lg-wrap { padding: 6px 6px 20px; }
.lg-sec { margin-bottom: 16px; }
.lg-h {
  font-family: Orbitron, sans-serif; font-size: 10.5px; font-weight: 700;
  letter-spacing: .18em; text-transform: uppercase; color: var(--blue);
  padding: 6px 0 7px; border-bottom: var(--hairline) solid var(--line); margin-bottom: 6px;
}
.lg-row { display: flex; gap: 12px; padding: 4.5px 0; align-items: baseline; }
.lg-t {
  flex: 0 0 108px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
  letter-spacing: .06em; color: var(--ink-45); text-align: right;
}
.lg-d { font-family: Inter, sans-serif; font-size: 12px; line-height: 1.5; color: var(--ink); flex: 1; min-width: 0; }

/* ---------------------------------------------------- the instance picker
   Which editor window this instrument is following. The plate is only ever as
   truthful as the thing it is pointed at, so the target is named in the bar
   rather than buried, and switching it is one click. */

   instrument in a browser, where the orrery has room. */
html[data-embed] .census,

/* ─────────────────────────────────────────────────────────────────────────────
   Reduced motion — added 2026-08-30 (motion-design skill).

   public/orrery.js already honours the preference on the canvas plate: it reads
   REDUCED at four animated terms so the plate settles on its resting frame. The
   CSS layer had no guard at all, so the eight keyframe animations and the SVG
   spine's pulses (.vb-halo, .gem-prog-pulse, .mbeads) kept running regardless.
   This closes that half.

   Blanket rather than per-selector on purpose: motion is still being added
   before the demo, and a blanket guard covers an animation written tomorrow.
   Every keyframe here was checked to end in a safe resting state before
   collapsing its duration — srise ends opacity:1/transform:none via `both`, so
   content still APPEARS; the decorative pulses (livepulse, vbhalo, gempulse)
   end transparent, which is the correct resting state for a halo.

   animation-delay is zeroed separately: the canonical blanket guard does not
   touch it, and the spine staggers 69 vertebrae at 26ms and the milestone rows
   at 30ms, so without this the column would still assemble sequentially over
   roughly 1.8s with each step merely instant.

   The four !important declarations are required — a universal selector loses on
   specificity to .live i, .vb.progress .vb-halo and friends. This is a
   deliberate, sanctioned use; design-qa's ">3 !important" warning is expected
   here and is not a defect to chase.
   ───────────────────────────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

const MOD_ATTR = (() => {

// Attribution: map live activity onto the entity graph.
// A file path lands on the planet whose home contains it; a tool name lands on
// the belt tool or comet workflow that carries it. Longest prefix wins, null means
// the event still counts (drive, ticker) but lights nothing specific.

function makeAttributor(stat) {
  const prefixes = (stat.attribution || [])
    .slice()
    .sort((a, b) => b.prefix.length - a.prefix.length);

  const workflowByName = new Map();
  for (const w of stat.workflows || []) workflowByName.set(w.name.toLowerCase(), w.id);

  const toolByName = new Map();
  for (const t of stat.tools || []) {
    toolByName.set(t.name.toLowerCase(), t.id);
    const bare = t.name.toLowerCase().replace(/\.(mjs|sh|py|ps1|vbs)$/, '');
    if (!toolByName.has(bare)) toolByName.set(bare, t.id);
  }

  const planetWords = (stat.planets || []).map(p => ({
    id: p.id,
    words: p.name.toLowerCase().split(/\s+/).filter(w => w.length > 3),
  })).filter(p => p.words.length);

  // A product the plan gives a `home` to is connected to the project itself:
  // work under that repo-relative path lights the declared planet even when the
  // words never match. Longest home wins, same rule as the history prefixes.
  const planetHomes = (stat.planets || [])
    .filter(p => p.home)
    .map(p => ({ id: p.id, home: String(p.home).replace(/\\/g, '/').replace(/^\.+\//, '').replace(/\/+$/, '') }))
    .filter(p => p.home)
    .sort((a, b) => b.home.length - a.home.length);

  function planetForPath(rel) {
    if (!rel) return null;
    const norm = String(rel).replace(/\\/g, '/').replace(/^\.\//, '');
    for (const { prefix, entity } of prefixes) {
      if (norm === prefix || norm.startsWith(prefix + '/')) return entity;
    }
    for (const { id, home } of planetHomes) {
      if (norm === home || norm.startsWith(home + '/')) return id;
    }

      const gap = Math.min(step * 0.22, 0.10);
      for (let i = 0; i < planN; i++) {
        const a0 = -Math.PI / 2 + i * step + gap / 2;
        const a1 = -Math.PI / 2 + (i + 1) * step - gap / 2;
        const st = flat[i];
        const lit = st ? st.status === 'done' : i < planDone;
        const inHand = !!(st && st.status === 'active');
        if (inHand) {
          ctx.beginPath();
          ctx.arc(CX, CY, rs, a0, a1);
          ctx.strokeStyle = css.live; ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.stroke();
          continue;
        }
        ctx.beginPath();
        ctx.arc(CX, CY, rs, a0, a1);
        ctx.strokeStyle = lit ? css.blue : css.ink28;
        ctx.lineWidth = lit ? 3.4 : 2.2;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
      // A charge travels the done segments, so the centre is never still while
      // the plan is moving. It rides the LIT ones only: the old form ran a
      // continuous head across the first planDone segments of the ring, which
      // painted blue over a step nobody had finished whenever the done steps
      // were not the first ones. A brighter mark on an unstarted step is a lie
      // in the strongest channel this plate has.
      if (planDone > 0 && !REDUCED) {
        const doneIx = [];
        for (let i = 0; i < planN; i++) if (flat[i] ? flat[i].status === 'done' : i < planDone) doneIx.push(i);
        const phase = (t / 1400) % doneIx.length;
        const which = doneIx[Math.floor(phase)];
        const frac = phase - Math.floor(phase);
        const a0 = -Math.PI / 2 + which * step + gap / 2;
        const a1 = -Math.PI / 2 + (which + 1) * step - gap / 2;
        const head = a0 + frac * (a1 - a0);
        ctx.beginPath();
        ctx.arc(CX, CY, rs, Math.max(a0, head - 0.16), head);
        ctx.strokeStyle = css.dark ? '#fff' : css.blueDeep;
        ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.globalAlpha = 0.85; ctx.stroke(); ctx.globalAlpha = 1;
      }
    } else {
      circle(CX, CY, 21.5, { stroke: css.line, w: 0.8 });
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * TAU;
        const l = i % 5 === 0 ? 4 : 2;
        line(CX + Math.cos(a) * 21.5, CY + Math.sin(a) * 21.5, CX + Math.cos(a) * (21.5 - l), CY + Math.sin(a) * (21.5 - l), css.ink45, 0.6);
      }
    }
    circle(CX, CY, 26, { stroke: css.lineFaint, w: 0.6 });
    circle(CX, CY, 29.5, { stroke: css.lineFaint, w: 0.5 });
    // Test seam: the plan ring is the one claim that has to be checked against
    // drawn pixels, and a walker cannot know where the hub is otherwise.
    window.__ORR_HUB = { cx: CX, cy: CY, planR: 18.5, planN, planDone, dpr: (window.devicePixelRatio || 1) };

    const hubName = (world.project.name || 'TBK Labs').toUpperCase();
    const hubTxt = hubName.length > 14 ? hubName : hubName.split('').join(' ');
    text(hubTxt, CX, CY + 43, { font: '7.5px "JetBrains Mono"', fill: css.ink45, align: 'center' });
    if (planN > 0) {
      text(`${planDone} of ${planN} steps`, CX, CY + 54, { font: '7.5px "JetBrains Mono"', fill: css.ink28, align: 'center' });
    } else if (world.plan && !world.plan.exists) {
      text('no plan declared', CX, CY + 54, { font: '7.5px "JetBrains Mono"', fill: css.ink28, align: 'center' });
    }

    /* -- bodies -- */
    drawComets(t, dim);
    const planets = world.stat.planets;
    let minorIx = 0, dynIx = 0;
    // How many products this project HAS decides how their names are set. Below
    // the threshold a name sits beside its planet, which reads best. Above it,
    // horizontal names cannot fit round one orbit and the flagship force-draw
    // (a name always renders) stacks them into a smear: measured on Maximus
    // Desktop, 26 products, where "Subagents" landed on "Visible learning".
    // Past the threshold each name is set RADIALLY along its own spoke, where
    // collision is impossible by construction rather than by testing for it.
    RADIAL_LABELS = planets.filter((q) => q.tier === 'flagship').length > 14;
    const benchDrawn = (shows('tools') && world.stat.tools.some((x) => usedHere(x.id)))
      || (shows('processes') && world.stat.processes.some((x) => usedHere(x.id)))
      || (shows('workflows') && world.stat.workflows.some((x) => usedHere(x.id)));
    PLATE_SCALE = benchDrawn ? 1 : 1.2;
    for (const p of (shows('products') ? planets : [])) {
      if (FLAGSHIP_SEAT[p.id]) drawPlanet(p, 0, t, T, dim, false);
      else if (p.tier === 'flagship') drawPlanet(p, dynIx++, t, T, dim, true);
      else drawPlanet(p, minorIx++, t, T, dim, false);
    }
    if (shows('tools')) drawBelt(t, dim);
    if (shows('processes')) drawProcessRing(t, dim);
    if (shows('agents')) drawAgents(t, dim);
    drawRim(T);
    flushLabels();
    drawTransients(nowMs);

    ctx.restore();
  }

  function drawPlanet(p, i, t, T, dim, dyn = false) {
    const born = T == null ? true : bornBy(p.id, T);
    const a = planetAngle(p, i, t, dyn);
    const orbR = planetRing(p, i, dyn);
    const x = CX + Math.cos(a) * orbR;
    const y = CY + Math.sin(a) * orbR;
    const r = planetRadius(p, T == null ? null : T);
    const { ms, feats } = massOf(p.id, T == null ? null : T);
    pos.set(p.id, { x, y, r, kind: p.tier === 'flagship' ? 'product' : 'project', label: p.name });
    bodiesDrawn++;

    const seatIx = FLAGSHIP_SEAT[p.id] ? RING_FRACS.indexOf(FLAGSHIP_SEAT[p.id].ring) : 5;
    const iw = easeOut((performance.now() - (introStart == null ? -1e9 : introStart) - (300 + seatIx * 90)) / 480);
    const faded = (dim(p.id) ? 0.32 : 1) * Math.max(0.001, iw);
    ctx.save();
    ctx.globalAlpha = faded;

    if (!born) {
      circle(x, y, Math.max(3.6, r * 0.55), { stroke: css.ink28, w: 0.9, dash: [2.5, 2.5] });
      ctx.restore();
      return;
    }

    const pulse = world.pulses[p.id];
    const fresh = pulse && (Date.now() - pulse.lastAt) < 4200;

    if (p.status === 'dormant') {
      circle(x, y, r, { stroke: css.ink45, w: 1.2, dash: [3.2, 2.8], fill: css.dark ? 'transparent' : css.paper });
      circle(x, y, r * 0.45, { stroke: css.ink28, w: 0.7, dash: [2, 2.4] });
    } else if (p.tier === 'flagship') {
      // shadowed disc with engraved latitudes, blue equator when live
      circle(x, y, r, { fill: css.card, stroke: css.ink, w: 1.5 });
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r - 0.8, 0, TAU); ctx.clip();
      for (let k = -3; k <= 3; k++) {
        const yy = y + k * (r / 3.4);
        const half = Math.sqrt(Math.max(0, r * r - (yy - y) * (yy - y)));
        line(x - half, yy, x + half, yy, css.ink45, k === 0 ? 0 : 0.55);
      }
      // terminator: engraved shade on the south-east limb
      ctx.beginPath();
      ctx.arc(x, y, r, rad(-24), rad(140));
      ctx.arc(x + r * 0.28, y - r * 0.18, r * 1.06, rad(132), rad(-18), true);
      ctx.closePath();
      ctx.fillStyle = css.dark ? 'rgba(0,0,0,.30)' : 'rgba(0,16,51,.075)';
      ctx.fill();
      ctx.restore();
      // A product wears the same grammar as its moons, because a product IS its
      // features: an equator once the builder claims the whole of it, one ring
      // when a judge has passed every part, two when the operator has accepted
      // them. Before this, a fully verified product and one nobody had touched
      // were the same disc, so the chain of custody stopped at the moon layer.
      const RINGS = { live: 0, claimed: 0, verified: 1, 'fully-verified': 2 };
      if (p.status in RINGS) {
        ctx.save();
        ctx.beginPath(); ctx.ellipse(x, y, r * 0.98, r * 0.34, 0, 0, TAU);
        ctx.strokeStyle = css.blue; ctx.lineWidth = 1.1; ctx.stroke();
        ctx.restore();
        for (let k = 1; k <= RINGS[p.status]; k++) {
          circle(x, y, r + 3.2 + k * 3.4, { stroke: k === 1 ? css.blue : css.blueMid, w: 1.0, alpha: 0.9 });
        }
      }
      circle(x - r * 0.32, y - r * 0.34, r * 0.14, { fill: css.dark ? css.blueDeep : '#fff', alpha: css.dark ? 0.9 : 0.9 });
    } else {
      circle(x, y, r, { fill: css.card, stroke: css.ink70, w: 1.1 });
      circle(x, y, r * 0.45, { stroke: css.ink28, w: 0.65 });
    }
    if (fresh) {
      circle(x, y, r + 3.5, { stroke: css.blue, w: 1.3, alpha: 0.85 });
      circle(x, y, 2, { fill: css.live });
    }
    if (css.dark && (p.status === 'live' || p.status === 'fully-verified')) circle(x, y, r + 1, { stroke: css.blueMid, w: 3.5, alpha: 0.3 });

    // moons
    const fs = featsOf(p.id);
    const shell0 = r + 8, shell1 = r + 14.5;
    ctx.globalAlpha = faded * easeOut((performance.now() - (introStart == null ? -1e9 : introStart) - 750) / 380);
    if (fs.length) circle(x, y, shell0, { stroke: css.line, w: 0.6 });
    if (fs.length > 6) circle(x, y, shell1, { stroke: css.line, w: 0.6 });
    fs.forEach((f, k) => {
      void k;
      const shell = k < 6 ? shell0 : shell1;
      const nIn = Math.min(fs.length, 6);
      const count = k < 6 ? nIn : fs.length - 6;
      const idx = k < 6 ? k : k - 6;
      const per = k < 6 ? 26 : 42;
      const ma = (idx / count) * TAU + (t / 1000 / per) * TAU + frac(f.id) * 0.9;
      const mx = x + Math.cos(ma) * shell;
      const my = y + Math.sin(ma) * shell;
      bodiesDrawn++;
      // A moon is the unit the whole grammar is built on, and it was the one
      // body never registered here: unhoverable, unnamed, with no dossier and
      // no thread to its own row on the spine. It is a body like any other now.
      pos.set(f.id, { x: mx, y: my, r: 5.5, kind: 'feature', label: f.name || f.plain || f.id, parent: p.id });
      // The rings COUNT THE SIGN-OFFS, so the chain of custody is legible from
      // across the room: hollow means nobody has spoken, filled means the
      // builder claims it, one ring means a judge passed it, two rings means the
      // operator accepted it. Each ring is a different party, and no party can
      // draw its own.
      if (f.inHand) {
        // in hand: hollow like an unclaimed moon, because nobody has signed it,
        // with a live arc turning on it so the eye finds the work in progress.
        circle(mx, my, 2.3, { stroke: css.pink, w: 1.2, fill: css.dark ? 'transparent' : css.paper });
        ctx.save();
        ctx.beginPath();
        const sweep = REDUCED ? 0 : (t / 900) % TAU;
        ctx.arc(mx, my, 4.6, sweep, sweep + 1.5);
        ctx.strokeStyle = css.live; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.stroke();
        ctx.restore();
      } else if (f.status === 'open') {
        circle(mx, my, 2.3, { stroke: css.pink, w: 1, fill: css.dark ? 'transparent' : css.paper });
      } else if (f.status === 'fully-verified') {
        circle(mx, my, 2.4, { fill: css.pink });
        circle(mx, my, 4.2, { stroke: css.blue, w: 1.1 });
        circle(mx, my, 6.4, { stroke: css.blueMid, w: 1.0 });
      } else if (f.status === 'verified') {
        circle(mx, my, 2.4, { fill: css.pink });
        circle(mx, my, 4.2, { stroke: css.blueMid, w: 0.9 });
      } else {
        circle(mx, my, 2.3, { fill: css.pink });
      }
    });

    ctx.globalAlpha = faded;
    // label request: candidate anchors clear of the moon shells, leader tick to the winner
    const shellMax = fs.length > 6 ? shell1 : fs.length ? shell0 : r;
    const posEntry = pos.get(p.id);
    if (posEntry) posEntry.blockR = shellMax + 2;
    const clearance = shellMax + 9;
    if (p.tier === 'flagship') {
      const nm = p.name.toUpperCase();
      const allMs = msOf(p.id);
      const doneMs = allMs.filter(mm => mm.status === 'done' && (T == null || (mm.date && +new Date(mm.date + 'T12:00:00Z') <= T))).length;
      const bits = [];
      if (allMs.length) bits.push(doneMs + '/' + allMs.length + ' milestones');
      if (feats) bits.push(feats + ' feat');
      bits.push(p.status);
      const sub = bits.join(' · ');
      ctx.font = '8px "JetBrains Mono"';
      const wSub = ctx.measureText(sub).width;
      ctx.font = '600 11px Orbitron';
      const wpx = Math.max(ctx.measureText(nm).width, wSub);
      const mk = (dA, extra, force) => {
        const la = a + dA;
        const cl = clearance + extra;
        const lx = x + Math.cos(la) * cl;
        const ly = y + Math.sin(la) * cl;
        const right = Math.cos(la) >= 0;
        const bx = right ? lx + 6 : lx - 6 - wpx;
        return {
          force,
          box: { x: bx, y: ly - 10, w: wpx, h: 26 },
          draw: () => {
            ctx.save(); ctx.globalAlpha = faded * LBLI;
            line(x + Math.cos(la) * (r + 1.5), y + Math.sin(la) * (r + 1.5), lx + (right ? 3 : -3), ly - 3, css.ink28, 0.6);
            const hx = right ? lx + 3 : lx - 3 - wpx - 6;
            ctx.fillStyle = css.halo;
            ctx.fillRect(hx, ly - 11, wpx + 9, 26);
            text(nm, right ? lx + 6 : lx - 6, ly, { font: '600 11px Orbitron', fill: css.ink, align: right ? 'left' : 'right' });
            text(sub, right ? lx + 6 : lx - 6, ly + 11.5, { font: '8px "JetBrains Mono"', fill: css.ink45, align: right ? 'left' : 'right' });
            ctx.restore();
          },
        };
      };
      // In hover mode only the body you are pointing at, or have pinned, is named.
      const named = labelMode === 'all' || view.focus === p.id
        || (view.hover && view.hover.id === p.id);
      if (!named) { /* no label this frame */ }
      else if (RADIAL_LABELS) {
        // Drawn straight rather than queued: a spoke label cannot collide with
        // another spoke label, so there is nothing for the allocator to test,
        // and putting it through the allocator would only let it be DROPPED.
        const flip = Math.cos(a) < 0;
        const lx = x + Math.cos(a) * (clearance + 3);
        const ly = y + Math.sin(a) * (clearance + 3);
        ctx.save();
        ctx.globalAlpha = faded * LBLI;
        ctx.translate(lx, ly);
        ctx.rotate(flip ? a + Math.PI : a);
        ctx.textAlign = flip ? 'right' : 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '600 10px Orbitron';
        ctx.fillStyle = css.ink;
        ctx.fillText(nm, 0, -5);
        ctx.font = '7.5px "JetBrains Mono"';
        ctx.fillStyle = css.ink45;
        ctx.fillText(sub, 0, 5);
        ctx.restore();
      } else {
        const angles = [0, 0.55, -0.55, 1.1, -1.1];
        const cands = [
          ...angles.map(dA => mk(dA, 0, false)),
          ...angles.map(dA => mk(dA, 18, false)),
          mk(0, 4, true), // a flagship name always renders
        ];
        queueLabel(0, cands, p.id);
      }
    } else {
      ctx.font = '8.5px "JetBrains Mono"';
      const wpx = ctx.measureText(p.name).width;
      const cands = [0, 0.7, -0.7, 1.4, -1.4].map((dA) => {
        const la = a + dA;
        const lx = x + Math.cos(la) * clearance;
        const ly = y + Math.sin(la) * clearance;
        const right = Math.cos(la) >= 0;
        const bx = right ? lx + 2 : lx - 2 - wpx;
        return {
          box: { x: bx, y: ly - 6, w: wpx, h: 12 },
          draw: () => {
            ctx.save(); ctx.globalAlpha = faded * LBLI;
            ctx.fillStyle = css.halo;
            ctx.fillRect(bx - 2, ly - 6, wpx + 4, 12);
            text(p.name, right ? lx + 2 : lx - 2, ly + 3, { font: '8.5px "JetBrains Mono"', fill: css.ink45, align: right ? 'left' : 'right' });
            ctx.restore();
          },
        };
      });
      if (labelMode === 'all' || view.focus === p.id || (view.hover && view.hover.id === p.id)) {
        queueLabel(fs.length >= 4 ? 1 : 2, cands, p.id);
      }
    }
    ctx.restore();
  }

  function drawBelt(t, dim) {
    const tools = world.stat.tools.filter((tl) => usedHere(tl.id));
    if (!tools.length) return; // no empty ruled band for tools that are not there
    const groups = new Map();
    for (const g of GROUP_ORDER) groups.set(g, []);
    for (const tl of tools) (groups.get(tl.group) || groups.get('bench')).push(tl);

    circle(CX, CY, BELT_BAND[0] * R, { stroke: css.lineFaint, w: 0.6, dash: [1, 4] });
    circle(CX, CY, BELT_BAND[1] * R, { stroke: css.lineFaint, w: 0.6, dash: [1, 4] });

    const GAP = rad(5);
    const total = tools.length;
    const active = GROUP_ORDER.filter(k => groups.get(k).length);
    let a0 = rad(-64);
    for (const g of active) {
      const items = groups.get(g);
      const span = (TAU - GAP * active.length) * (items.length / total);
      items.forEach((tl, k) => {
        const a = a0 + (span * (k + 0.5)) / items.length;
        const rr = (BELT_BAND[0] + (BELT_BAND[1] - BELT_BAND[0]) * frac(tl.id, 5)) * R;
        const x = CX + Math.cos(a) * rr;
        const y = CY + Math.sin(a) * rr;
        const s = 3.4 + 1.8 * frac(tl.id, 9);
        pos.set(tl.id, { x, y, r: s + 3, kind: 'tool', label: tl.name });
        bodiesDrawn++;
        const pulse = world.pulses[tl.id];
        const freshT = pulse && (Date.now() - pulse.lastAt) < 5000;
        ctx.save();
        let na = a % TAU; if (na < 0) na += TAU;
        ctx.globalAlpha = (dim(tl.id) ? 0.3 : 1) * Math.max(0.001, easeOut((performance.now() - (introStart == null ? -1e9 : introStart) - (600 + (na / TAU) * 550)) / 320));
        ctx.translate(x, y); ctx.rotate(a + Math.PI / 4);
        ctx.beginPath(); ctx.rect(-s / 2, -s / 2, s, s);
        if (freshT) { ctx.fillStyle = css.blue; ctx.fill(); }
        else if (frac(tl.id, 2) < 0.32) { ctx.fillStyle = css.ink70; ctx.fill(); }
        else { ctx.strokeStyle = css.ink70; ctx.lineWidth = 0.9; ctx.stroke(); }
        ctx.restore();
        if (freshT) { circle(x, y, s + 4, { stroke: css.blueMid, w: 1 }); circle(x, y, 1.5, { fill: css.live }); }
      });
      const mid = a0 + span / 2;
      const lr2 = (BELT_BAND[1] + 0.026) * R;
      const lx = CX + Math.cos(mid) * lr2;
      const ly = CY + Math.sin(mid) * lr2;
      queueLabel(4, {
        box: { x: lx - 24, y: ly - 6, w: 48, h: 12 },
        draw: () => {
          ctx.save();
          ctx.translate(lx, ly);
          let rot = mid + Math.PI / 2;
          if (Math.sin(mid) > 0) rot += Math.PI;
          ctx.rotate(rot);
          text(g.toUpperCase(), 0, 0, { font: '7.5px "JetBrains Mono"', fill: css.ink28, align: 'center', spacing: 2 });
          ctx.restore();
        },
      });
      a0 += span + GAP;
    }
  }

  // The ring had room for a name, and it was being handed a sentence.
  // "FEATURES LEDGER CAPTURE" over "RULE 39" is three words and a citation for
  // something that needs to read as one label at a glance. Wassim, 2026-08-28:
  // "There is no reason to include the expanded name, family history, and
  // ancestry of every damn thing. Instead of features ledger capture, you can
  // put 'Feat. Ledger'." Short names on the ring; the full name and the rule
  // number are on the body, which is what the dossier is for.
  const SKIP = new Set(['TO', 'THE', 'OF', 'AND', 'FOR', 'A']);
  function ringLabel(name) {
    const up = String(name || '').toUpperCase();
    if (up.length <= 16) return up;
    const words = up.split(/[\s]+/).filter((w) => !SKIP.has(w));
    const head = words.slice(0, 2).map((w, i) => (i === 0 && w.length > 6 ? w.slice(0, 4) + '.' : w));
    const out = head.join(' ');
    return out.length <= 16 ? out : out.slice(0, 15) + '.';
  }

  function drawProcessRing(t, dim) {
    const procs = world.stat.processes.filter((pr) => usedHere(pr.id));
    // Nothing used, nothing drawn. The two guide circles used to be painted
    // regardless, leaving an empty ruled band around a plate that has no
    // processes on it: chrome for content that is not there.
    if (!procs.length) return;
    const rr = PROC_R * R;
    const GAP = rad(2.6);
    const span = (TAU - GAP * procs.length) / procs.length;
    let a0 = rad(-90) + GAP / 2;
    circle(CX, CY, rr - 4, { stroke: css.lineFaint, w: 0.7 });
    circle(CX, CY, rr + 4, { stroke: css.lineFaint, w: 0.7 });
    for (const p of procs) {
      const a1 = a0 + span;
      const pulse = world.pulses[p.id];
      const freshP = pulse && (Date.now() - pulse.lastAt) < 5000;
      const faded = dim(p.id) ? 0.3 : 1;
      const psw = easeOut((performance.now() - (introStart == null ? -1e9 : introStart) - (850 + procs.indexOf(p) * 35)) / 450);
      if (psw > 0.01) arc(CX, CY, rr, a0, a0 + (a1 - a0) * psw, { stroke: freshP ? css.blue : css.amber, w: freshP ? 2.8 : 2.1, alpha: faded });
      for (const aa of [a0, a1]) {
        line(CX + Math.cos(aa) * (rr - 5.5), CY + Math.sin(aa) * (rr - 5.5), CX + Math.cos(aa) * (rr + 5.5), CY + Math.sin(aa) * (rr + 5.5), css.ink45, 0.8);
      }
      const mid = (a0 + a1) / 2;
      const mx = CX + Math.cos(mid) * rr;
      const my = CY + Math.sin(mid) * rr;
      pos.set(p.id, { x: mx, y: my, r: 13, kind: 'process', label: p.name, arc: [a0, a1, rr] });
      bodiesDrawn++;
      // The ring's own strokes used to run straight through its labels. The tick
      // marks reach rr+5.5 and the outer guide circle sits at rr+4, and the label
      // band started at rr+13, so a name overlapped both. It now starts clear of
      // them and knocks out its own background, so nothing can cross a glyph.
      const lr = rr + 21;
      const plx = CX + Math.cos(mid) * lr;
      const ply = CY + Math.sin(mid) * lr;
      const flipped = Math.sin(mid) > 0;
      const nm = ringLabel(p.name);
      ctx.font = '8px "JetBrains Mono"';
      const nmW = ctx.measureText(nm).width + nm.length * 1.2;
      queueLabel(1, {
        // the real measured width, not a fixed 80px guess: "TROUBLESHOOTING
